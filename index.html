<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6bcb" />
    <meta name="description" content="Plano pessoal de dieta, treino e evolução de Alex Mendonça." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Meu Plano</title>
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <main id="app" aria-live="polite"></main>
      <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-tab="hoje" aria-label="Hoje"><span>⌂</span><small>Hoje</small></button>
        <button class="nav-item" data-tab="dieta" aria-label="Dieta"><span>◉</span><small>Dieta</small></button>
        <button class="nav-item" data-tab="treino" aria-label="Treino"><span>↔</span><small>Treino</small></button>
        <button class="nav-item" data-tab="evolucao" aria-label="Evolução"><span>▥</span><small>Evolução</small></button>
        <button class="nav-item" data-tab="perfil" aria-label="Perfil"><span>♙</span><small>Perfil</small></button>
      </nav>
    </div>
    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0"></script>
    <script src="./config.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
